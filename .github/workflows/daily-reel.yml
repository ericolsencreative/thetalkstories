name: Daily reel
on:
  schedule:
    # GitHub's timer often runs hours late, so start early; the script holds the post until 4:55 PM Pacific.
    - cron: "0 21 * * *"   # 1:00 PM PST
    - cron: "0 23 * * *"   # 3:00 PM PST (backup)
    - cron: "30 1 * * *"   # 5:30 PM PST (last-chance backup)
  workflow_dispatch:
    inputs:
      slug:
        description: "Post a specific queued reel now (optional)"
        required: false
permissions:
  contents: write
concurrency: daily-reel
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "thetalk-bot"
          git config user.email "hello@thetalkstories.com"
      - run: python3 scripts/post_reel.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FORCE_SLUG: ${{ github.event.inputs.slug }}
          PYTHONUNBUFFERED: "1"
