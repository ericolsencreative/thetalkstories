name: Daily reel
on:
  schedule:
    # The Cloudflare scheduler starts this job at 4:45 AM Pacific and the script posts at 4:55.
    # GitHub's own timer runs hours late, so these are only safety nets for a day the scheduler misses.
    - cron: "23 14 * * *"   # 6:23 AM PST (backup)
    - cron: "11 16 * * *"   # 8:11 AM PST (last-chance backup)
  workflow_dispatch:
    inputs:
      slug:
        description: "Post a specific queued reel now (optional)"
        required: false
permissions:
  contents: write
concurrency: daily-reel
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "thetalk-bot"
          git config user.email "hello@thetalkstories.com"
      - name: Post today's reel
        shell: bash  # pipefail, so the step still fails when the script fails
        run: python3 scripts/post_reel.py 2>&1 | tee "$RUNNER_TEMP/post.log"
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FORCE_SLUG: ${{ github.event.inputs.slug }}
          PYTHONUNBUFFERED: "1"
      # Long-lived Instagram tokens expire after 60 days unless refreshed. Refreshing here means the
      # token renews on runs the scheduler starts, not only on GitHub's own Monday timer.
      - name: Refresh Instagram token (never blocks the post)
        if: always()
        continue-on-error: true
        env:
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          if [ -z "$IG_TOKEN" ] || [ -z "$GH_SECRETS_PAT" ]; then echo "Secrets missing; skipping refresh"; exit 0; fi
          RESP=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_TOKEN")
          NEW=$(echo "$RESP" | python3 -c "import json,sys;print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null || true)
          if [ -z "$NEW" ]; then echo "No new token this run (tokens under 24 hours old can't be refreshed); the Monday workflow is the backup"; exit 0; fi
          echo "::add-mask::$NEW"
          GH_TOKEN=$GH_SECRETS_PAT gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEW"
          echo "IG_TOKEN refreshed"
      # Dead-man's switch: healthchecks.io emails Eric if a day passes with no reel posted.
      # Runs that post nothing (backups, "Nothing due") do not ping.
      - name: Tell healthchecks.io a reel was posted
        if: success()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if ! grep -qE "^(Posted|Already (posted|done)) " "$RUNNER_TEMP/post.log"; then echo "No reel posted this run; not pinging"; exit 0; fi
          if [ -n "$HEALTHCHECK_URL" ]; then curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" > /dev/null || true; fi
