name: Refresh Instagram token
on:
  schedule:
    - cron: "17 19 * * 1"  # Mondays 11:17 AM PST
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh IG_TOKEN (long-lived tokens expire after 60 days unless refreshed)
        env:
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          RESP=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_TOKEN")
          NEW=$(echo "$RESP" | python3 -c "import json,sys;print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$NEW" ]; then echo "Refresh failed"; echo "$RESP" | sed 's/access_token[^,]*//'; exit 1; fi
          echo "::add-mask::$NEW"
          DAYS=$(echo "$RESP" | python3 -c "import json,sys;print(int(json.load(sys.stdin).get('expires_in',0))//86400)")
          GH_TOKEN=$GH_SECRETS_PAT gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEW"
          echo "IG_TOKEN refreshed; valid for $DAYS more days"
